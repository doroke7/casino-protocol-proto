syntax = "proto3";

package pb.resource.logic;

option go_package = "./pb_resource_logic";

import "resource/common.proto";

service AppUserModel {
  rpc AddAppUser(AppUserAddAppUserInput) returns (AppUserAddAppUserOutput);
}

message AppUserAddAppUserInput {
  pb.resource.AppUserValue value = 1;
}

message AppUserAddAppUserOutput {
  pb.resource.AppUser app_user = 1;
}
