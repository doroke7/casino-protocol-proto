syntax = "proto3";

package pb.resource.logic;

option go_package = "./pb_resource_logic";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

service GameLogic {
  rpc ShowGamesTotalByFiltersWithSortersPagination(GameShowGamesTotalByFiltersWithSortersPaginationInput) returns (GameShowGamesTotalByFiltersWithSortersPaginationOutput);

}

message GameType {
  uint32 id = 1;
  string key = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
}

message Game {
  uint32 id = 1;
  uint32 game_type_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp deleted_at = 8;
  GameType game_type = 9;
}

message GameFilter {
  string field = 1;
  string operator = 2;
  google.protobuf.Value value = 3;

}

message GameSorter {
  string field = 1;
  string order = 2;

}


message GamePagination {
  uint64 size = 1;
  uint64 page = 2;
}

message GameShowGamesTotalByFiltersWithSortersPaginationInput {
  repeated GameFilter filters = 1;
  repeated GameSorter sorters = 2;
  GamePagination pagination = 3;
}



message GameShowGamesTotalByFiltersWithSortersPaginationOutput {
  repeated Game games = 1;
  uint64 total = 2;
}

