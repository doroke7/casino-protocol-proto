syntax = "proto3";

package pb.resource.logic;

option go_package = "./pb_resource_logic";

import "resource/common.proto";

service GameLogic {
  rpc ShowGamesTotalByFiltersWithSortersPagination(GameShowGamesTotalByFiltersWithSortersPaginationInput) returns (GameShowGamesTotalByFiltersWithSortersPaginationOutput);

}

message GameShowGamesTotalByFiltersWithSortersPaginationInput {
  repeated pb.resource.Filter filters = 1;
  repeated pb.resource.Sorter sorters = 2;
  pb.resource.Pagination pagination = 3;
}

message GameShowGamesTotalByFiltersWithSortersPaginationOutput {
  repeated pb.resource.Game games = 1;
  uint64 total = 2;
}
