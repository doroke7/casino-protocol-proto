syntax = "proto3";

package pb.resource;

option go_package = "example/pb/resource;pb_resource";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message Filter {
  string field = 1;
  string operator = 2;
  google.protobuf.Value value = 3;
}

message Sorter {
  string field = 1;
  string order = 2;
}

message Pagination {
  uint64 size = 1;
  uint64 page = 2;
}

message GameType {
  uint32 id = 1;
  string key = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
  uint32 parent_id = 7;
  GameType parent = 8;
  repeated GameType children = 9;
}

message AdminUser {
  uint32 id = 1;
  string name = 2;
  string password = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
}

message AdminRole {
  uint32 id = 1;
  string key = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
}

message AdminPermission {
  uint32 id = 1;
  uint32 type = 2;
  string key = 3;
  string name = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp deleted_at = 7;
}

message AppUser {
  uint32 id = 1;
  string name = 2;
  string password = 3;
  uint32 balance = 4;
}

message Game {
  uint32 id = 1;
  uint32 game_type_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp deleted_at = 8;
  GameType game_type = 9;
}

message Table {
  uint32 id = 1;
  string no = 2;
  uint32 game_id = 3;
  string key = 4;
  uint32 state = 5;
  string description = 6;
  string result = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp ended_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp deleted_at = 12;
  Game game = 13;
}
