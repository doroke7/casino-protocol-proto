syntax = "proto3";

package pb.resource;

option go_package = "example/pb/resource;pb_resource";

import "google/protobuf/struct.proto";

message Filter {
  string field = 1;
  string operator = 2;
  google.protobuf.Value value = 3;
}

message Sorter {
  string field = 1;
  string order = 2;
}

message Pagination {
  uint64 size = 1;
  uint64 page = 2;
}
