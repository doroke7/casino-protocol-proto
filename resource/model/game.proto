syntax = "proto3";

package pb.resource.model;

option go_package = "./pb_resource_model";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

service GameModel {
  rpc AddOne(GameAddOneInput) returns (GameAddOneOutput);
  rpc ShowOneById(GameShowOneByIdInput) returns (GameShowOneByIdOutput);
  rpc ShowOnesByFiltersWithOrdersPagination(GameShowOnesByFiltersWithOrdersPaginationInput) returns (GameShowOnesByFiltersWithOrdersPaginationOutput);
  rpc EditOneById(GameEditOneByIdInput) returns (GameEditOneByIdOutput);
  rpc RemoveOneById(GameRemoveOneByIdInput) returns (GameRemoveOneByIdOutput);
  rpc TotalByFilters(GameTotalByFiltersInput) returns (GameTotalByFiltersOutput);

}


message GameFilter {
  string field = 1;
  string operator = 2;
  google.protobuf.Value value = 3;
}

message GameSorter {
  string field = 1;
  string order = 2;
}



message GamePagination {
  uint64 size = 1;
  uint64 page = 2;
}

message GameType {
  uint32 id = 1;
  string key = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
}

message Game{
  uint32 id = 1;
  uint32 game_type_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp deleted_at = 8;
  GameType game_type = 9;
}

message GameAddOneInput{
  optional uint32 game_type_id = 1;
  optional string key = 2;
  optional string name = 3;
  optional string description = 4;
}

message GameAddOneOutput{
  uint32 id = 1;
  uint32 game_type_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp deleted_at = 8;
}

message GameShowOneByIdInput{
  uint32 id = 1;
}

message GameShowOneByIdOutput{
  uint32 id = 1;
  uint32 game_type_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp deleted_at = 8;
  GameType game_type = 9;
}

message GameEditOneByIdInput{
  uint32 id = 1;
  optional uint32 game_type_id = 2;
  optional string key = 3;
  optional string name = 4;
  optional string description = 5;
}


message GameEditOneByIdOutput{
  bool status = 1;
}



message GameRemoveOneByIdInput{
  uint32 id = 1;
}

message GameRemoveOneByIdOutput{
  bool status = 1;
}

message GameShowOnesByFiltersWithOrdersPaginationInput{
  repeated GameFilter filters = 2;
  repeated GameSorter sorters = 3;
  GamePagination pagination = 1;
}


message GameShowOnesByFiltersWithOrdersPaginationOutput{
  repeated Game games = 1;
}



message GameTotalByFiltersInput{
  repeated GameFilter filters = 1;
}


message GameTotalByFiltersOutput{
  uint64 total = 1;
}
