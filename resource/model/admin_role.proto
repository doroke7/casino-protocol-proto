syntax = "proto3";

package pb.resource.model;

option go_package = "./pb_resource_model";

import "resource/common.proto";

service AdminRoleModel {
  rpc AddOne(AdminRoleAddOneInput) returns (AdminRoleAddOneOutput);
  rpc ShowOneById(AdminRoleShowOneByIdInput) returns (AdminRoleShowOneByIdOutput);
  rpc EditOneById(AdminRoleEditOneByIdInput) returns (AdminRoleEditOneByIdOutput);
  rpc RemoveOneById(AdminRoleRemoveOneByIdInput) returns (AdminRoleRemoveOneByIdOutput);
  rpc ShowOnes(AdminRoleShowOnesInput) returns (AdminRoleShowOnesOutput);
  rpc ShowOnesByFiltersWithSortersPagination(AdminRoleShowOnesByFiltersWithSortersPaginationInput) returns (AdminRoleShowOnesByFiltersWithSortersPaginationOutput);
  rpc TotalByFilters(AdminRoleTotalByFiltersInput) returns (AdminRoleTotalByFiltersOutput);
}

message AdminRoleAddOneInput {
  pb.resource.AdminRoleVariable variable = 1;
}

message AdminRoleAddOneOutput {}

message AdminRoleShowOneByIdInput {
  uint64 id = 1;
}

message AdminRoleShowOneByIdOutput {
  pb.resource.AdminRole admin_role = 1;
}

message AdminRoleEditOneByIdInput {
  pb.resource.AdminRoleVariable variable = 1;
  uint64 id = 2;
}

message AdminRoleEditOneByIdOutput {}

message AdminRoleRemoveOneByIdInput {
  uint64 id = 1;
}

message AdminRoleRemoveOneByIdOutput {}

message AdminRoleShowOnesInput {}

message AdminRoleShowOnesOutput {
  repeated pb.resource.AdminRole admin_roles = 1;
}

message AdminRoleShowOnesByFiltersWithSortersPaginationInput {
  repeated pb.resource.Filter filters = 1;
  repeated pb.resource.Sorter sorters = 2;
  pb.resource.Pagination pagination = 3;
}

message AdminRoleShowOnesByFiltersWithSortersPaginationOutput {
  repeated pb.resource.AdminRole admin_roles = 1;
}

message AdminRoleTotalByFiltersInput {
  repeated pb.resource.Filter filters = 1;
}

message AdminRoleTotalByFiltersOutput {
  uint64 total = 1;
}
