syntax = "proto3";

package pb.resource.model;

option go_package = "./pb_resource_model";

import "common.proto";

service AdminPermissionGroupModel {
  rpc AddOne(AdminPermissionGroupAddOneInput) returns (AdminPermissionGroupAddOneOutput);
  rpc ShowOnesByParentId(AdminPermissionGroupShowOnesByParentIdInput) returns (AdminPermissionGroupShowOnesByParentIdOutput);
  rpc ShowOnesByFiltersWithSortersPagination(AdminPermissionGroupShowOnesByFiltersWithSortersPaginationInput) returns (AdminPermissionGroupShowOnesByFiltersWithSortersPaginationOutput);
  rpc EditOneById(AdminPermissionGroupEditOneByIdInput) returns (AdminPermissionGroupEditOneByIdOutput);
  rpc RemoveOneById(AdminPermissionGroupRemoveOneByIdInput) returns (AdminPermissionGroupRemoveOneByIdOutput);
  rpc TotalByFilters(AdminPermissionGroupTotalByFiltersInput) returns (AdminPermissionGroupTotalByFiltersOutput);
}

message AdminPermissionGroupAddOneInput {
  pb.AdminPermissionGroupVariable variable = 1;
}

message AdminPermissionGroupAddOneOutput {
  pb.AdminPermissionGroup admin_permission_group = 1;
}

message AdminPermissionGroupEditOneByIdInput {
  pb.AdminPermissionGroupVariable variable = 1;
  uint64 id = 2;
}

message AdminPermissionGroupEditOneByIdOutput {}

message AdminPermissionGroupRemoveOneByIdInput {
  uint64 id = 1;
}

message AdminPermissionGroupRemoveOneByIdOutput {}

message AdminPermissionGroupShowOnesByParentIdInput {
  uint64 parent_id = 1;
}

message AdminPermissionGroupShowOnesByParentIdOutput {
  repeated pb.AdminPermissionGroup admin_permission_groups = 1;
}

message AdminPermissionGroupShowOnesByFiltersWithSortersPaginationInput {
  repeated pb.Filter filters = 1;
  repeated pb.Sorter sorters = 2;
  pb.Pagination pagination = 3;
}

message AdminPermissionGroupShowOnesByFiltersWithSortersPaginationOutput {
  repeated pb.AdminPermissionGroup admin_permission_groups = 1;
}

message AdminPermissionGroupTotalByFiltersInput {
  repeated pb.Filter filters = 1;
}

message AdminPermissionGroupTotalByFiltersOutput {
  uint64 total = 1;
}
