syntax = "proto3";

package pb.resource.model;

option go_package = "./pb_resource_model";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "resource/model/game.proto";

service GameTypeModel {
  rpc AddOne(GameTypeAddOneInput) returns (GameTypeAddOneOutput);
  rpc ShowOneById(GameTypeShowOneByIdInput) returns (GameTypeShowOneByIdOutput);
  rpc ShowOnesByFiltersWithSortersPagination(GameTypeShowOnesByFiltersWithSortersPaginationInput) returns (GameTypeShowOnesByFiltersWithSortersPaginationOutput);
  rpc EditOneById(GameTypeEditOneByIdInput) returns (GameTypeEditOneByIdOutput);
  rpc RemoveOneById(GameTypeRemoveOneByIdInput) returns (GameTypeRemoveOneByIdOutput);
  rpc TotalByFilters(GameTypeTotalByFiltersInput) returns (GameTypeTotalByFiltersOutput);
}

message GameTypeFilter {
  string field = 1;
  string operator = 2;
  google.protobuf.Value value = 3;
}

message GameTypeSorter {
  string field = 1;
  string order = 2;
}

message GameTypePagination {
  uint64 size = 1;
  uint64 page = 2;
}

message GameTypeAddOneInput {
  optional string key = 1;
  optional string name = 2;
}

message GameTypeAddOneOutput {
  uint32 id = 1;
  string key = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
}

message GameTypeShowOneByIdInput {
  uint32 id = 1;
}

message GameTypeShowOneByIdOutput {
  uint32 id = 1;
  string key = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
}

message GameTypeEditOneByIdInput {
  uint32 id = 1;
  optional string key = 2;
  optional string name = 3;
}

message GameTypeEditOneByIdOutput {
  bool status = 1;
}

message GameTypeRemoveOneByIdInput {
  uint32 id = 1;
}

message GameTypeRemoveOneByIdOutput {
  bool status = 1;
}

message GameTypeShowOnesByFiltersWithSortersPaginationInput {
  GameTypePagination pagination = 1;
  repeated GameTypeFilter filters = 2;
  repeated GameTypeSorter sorters = 3;
}

message GameTypeShowOnesByFiltersWithSortersPaginationOutput {
  repeated GameType game_types = 1;
}

message GameTypeTotalByFiltersInput {
  repeated GameTypeFilter filters = 1;
}

message GameTypeTotalByFiltersOutput {
  uint64 total = 1;
}
