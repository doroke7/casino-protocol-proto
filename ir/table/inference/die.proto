syntax = "proto3";

package pb.ir.table.inference;

option go_package = "./pb_ir_table_inference";

service DieService {
  /*
     提供三種 api
     1. 辨識 骰子 的 位置
     2. 辨識 場景 的 位置
     3. 辨識 骰子 + 場景  位置
  */

  rpc RecognizeDie(DieRecognizeDieRequest) returns (DieRecognizeDieResponse);
  rpc RecognizeScene(DieRecognizeSceneRequest) returns (DieRecognizeSceneResponse);
  rpc RecognizeAll(DieRecognizeAllRequest) returns (DieRecognizeAllResponse);
}

message DieRecognizeDieRequest {

}

message DieRecognizeSceneRequest {

}

message DieRecognizeAllRequest {

}

message DieRecognizeDieResponse {
  repeated Die dice = 1;
}

message DieRecognizeSceneResponse {
  repeated DieScene scenes = 1;
}

message DieRecognizeAllResponse {
  repeated DieScene scenes = 1;
  repeated Die dice = 2;
}

message Die {
  // Bounding box in pixels, origin at the top-left corner of the image.
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  // Confidence in [0, 1].
  float confidence = 5;
}

message DieScene {
  // Bounding box in pixels, origin at the top-left corner of the image.
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  // Confidence in [0, 1].
  float confidence = 5;
}
