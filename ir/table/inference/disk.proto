syntax = "proto3";

package pb.ir.table.inference;

option go_package = "./pb_ir_table_inference";

service DiskService {
  /*
     提供三種 api
     1. 辨識 圓盤 的 位置
     2. 辨識 場景 的 位置
     3. 辨識 圓盤 + 場景  位置
  */

  rpc RecognizeDisk(DiskRecognizeDiskRequest) returns (DiskRecognizeDiskResponse);
  rpc RecognizeScene(DiskRecognizeSceneRequest) returns (DiskRecognizeSceneResponse);
  rpc RecognizeAll(DiskRecognizeAllRequest) returns (DiskRecognizeAllResponse);
}

message DiskRecognizeDiskRequest {

}

message DiskRecognizeSceneRequest {

}

message DiskRecognizeAllRequest {

}

message DiskRecognizeDiskResponse {
  repeated Disk disks = 1;
}

message DiskRecognizeSceneResponse {
  repeated DiskScene scenes = 1;
}

message DiskRecognizeAllResponse {
  repeated DiskScene scenes = 1;
  repeated Disk disks = 2;
}

message Disk {
  // Bounding box in pixels, origin at the top-left corner of the image.
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  // Confidence in [0, 1].
  float confidence = 5;
}

message DiskScene {
  // Bounding box in pixels, origin at the top-left corner of the image.
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  // Confidence in [0, 1].
  float confidence = 5;
}
