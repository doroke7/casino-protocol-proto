syntax = "proto3";

package pb.ir.table.inference;

option go_package = "./pb_ir_table_inference";

service PokerService {
  // Recognize finds the poker cards in a single image.
  rpc Recognize(PokerRecognizeRequest) returns (PokerRecognizeResponse);
}

message PokerRecognizeRequest {
  // Encoded image bytes (JPEG or PNG).
  bytes image = 1;
}

message PokerRecognizeResponse {
  repeated Poker items = 1;
}

message Poker {
  // Card face, e.g. "A", "10", "K".
  string rank = 1;
  // Card suit, e.g. "spade", "heart", "diamond", "club".
  string suit = 2;
  // Bounding box in pixels, origin at the top-left corner of the image.
  int32 x = 3;
  int32 y = 4;
  int32 width = 5;
  int32 height = 6;
  // Confidence in [0, 1].
  float confidence = 7;
}
