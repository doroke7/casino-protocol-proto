syntax = "proto3";

package pb.facade.admin.authentication;

import "facade/common.proto";

option go_package = "./pb_facade_admin_authentication";

service AuthenticatorController {
  rpc SignIn(AuthenticatorSignInRequest) returns (AuthenticatorSignInResponse);
}

message AuthenticatorSignInRequest {
  pb.facade.AdminUserVariable variable = 1;
}

message AuthenticatorSignInResponse {}
