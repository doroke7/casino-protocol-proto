syntax = "proto3";

package pb.recognition;

option go_package = "./pb_recognition";

message Poker {
  string rank = 1;
  string suit = 2;
  int32 x = 3;
  int32 y = 4;
  int32 width = 5;
  int32 height = 6;
  // Confidence in [0, 1].
  float confidence = 7;
}

message Disk {
  // Bounding box in pixels, origin at the top-left corner of the image.
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  // Confidence in [0, 1].
  float confidence = 5;
}

message Die {
  
  string value = 1;
  int32 x = 2;
  int32 y = 3;
  int32 width = 4;
  int32 height = 5;
  // Confidence in [0, 1].
  float confidence = 6;
}

message Object {
  string class = 1;
  int32 x = 2;
  int32 y = 3;
  int32 width = 4;
  int32 height = 5;
  // Confidence in [0, 1].
  float confidence = 6;
}
