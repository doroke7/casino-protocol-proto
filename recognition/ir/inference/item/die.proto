syntax = "proto3";

package pb.recognition.ir.inference.item;

option go_package = "./pb_recognition_ir_inference_item";

import "recognition/ir.proto";

service DieService {
  rpc RecognizeItems(DieRecognizeItemsRequest) returns (stream DieRecognizeItemsResponse);
}

message DieRecognizeItemsRequest {

}

message DieRecognizeItemsResponse {
  repeated pb.recognition.Die items = 1;
}
