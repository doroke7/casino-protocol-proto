syntax = "proto3";

package pb.recognition.ir.inference.item;

option go_package = "./pb_recognition_ir_inference_item";

import "recognition/ir.proto";

service DiskService {
  rpc RecognizeItems(DiskRecognizeItemsRequest) returns (DiskRecognizeItemsResponse);
}

message DiskRecognizeItemsRequest {

}

message DiskRecognizeItemsResponse {
