syntax = "proto3";

package pb.recognition.ir.inference.equipment;

option go_package = "./pb_recognition_ir_inference_equipment";

import "recognition/ir.proto";

service DiskService {
  rpc RecognizeDisk(RecognizeDiskRequest) returns (RecognizeDiskResponse);
}

message RecognizeDiskRequest {

}

message RecognizeDiskResponse {
  repeated pb.recognition.Disk items = 1;
}
